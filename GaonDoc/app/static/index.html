<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>GaonDoc</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#0f1f1c;--mute:#5b6b67;--line:#dbe5e2;--brand:#0f766e;--brand-ink:#fff;--soft:#e6f4f1;--emerg:#b42318;--emerg-bg:#fef3f2;--urgent:#b54708;--urgent-bg:#fffaeb;--adv:#175cd3;--adv-bg:#eff8ff;--ok:#067647;--radius:16px;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1513;--card:#142220;--ink:#e8f1ef;--mute:#93a8a3;--line:#24373a;--soft:#17302d;--emerg-bg:#3a1512;--urgent-bg:#37250a;--adv-bg:#10253f;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--brand);color:var(--brand-ink)}
header img{width:32px;height:32px;border-radius:8px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header small{opacity:.85;display:block;font-weight:400;font-size:12px}
header .sp{flex:1}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
h2{font-size:15px;margin:0 0 12px;font-weight:700}
h3{font-size:13px;margin:16px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
select,input[type=text],input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:var(--brand-ink);font-weight:600}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.consent{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--soft);margin:16px 0}
.consent input{width:22px;height:22px;margin-top:2px}
.hidden{display:none!important}
.layout{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.layout{grid-template-columns:1.1fr 1fr}}
.mics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mic{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 8px;border-radius:18px;background:var(--soft);color:var(--brand);border:2px solid transparent;font-size:15px}
.mic svg{width:34px;height:34px}
.mic small{font-weight:500;color:var(--mute)}
.mic.on{background:var(--emerg);color:#fff;animation:pulse 1.2s infinite}
.mic.on small{color:#ffe4e1}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(180,35,24,.2)}}
.typed{display:grid;grid-template-columns:110px 1fr auto;gap:8px;margin-top:12px}
#log{display:grid;gap:10px;max-height:46vh;overflow:auto;margin-top:16px;padding-right:2px}
.msg{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.msg.patient{border-left:4px solid var(--brand)}
.msg.doctor{border-left:4px solid var(--adv)}
.msg .who{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.msg .tr{margin-top:6px;font-weight:600}
.msg .meta{margin-top:6px;font-size:12px;color:var(--mute)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--brand);font-weight:700;margin-left:6px}
.badge.warn{background:var(--urgent-bg);color:var(--urgent)}
#alert{border-radius:var(--radius);padding:16px;border:2px solid var(--emerg);background:var(--emerg-bg);color:var(--emerg)}
#alert strong{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
#alert p{margin:6px 0 0;font-size:19px;font-weight:700;line-height:1.4}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}
.tab{background:transparent;color:var(--mute);border:1px solid var(--line);padding:8px 14px}
.tab.active{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:600}
.chip.no{background:transparent;border:1px dashed var(--line);color:var(--mute);font-weight:500}
.flag{padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;border:1px solid}
.flag b{text-transform:uppercase;font-size:11px;letter-spacing:.6px;display:block}
.flag.emergency{background:var(--emerg-bg);color:var(--emerg);border-color:var(--emerg)}
.flag.urgent{background:var(--urgent-bg);color:var(--urgent);border-color:var(--urgent)}
.flag.advisory{background:var(--adv-bg);color:var(--adv);border-color:var(--adv)}
.dx{padding:10px 0;border-bottom:1px solid var(--line)}
.dx:last-child{border:0}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand)}
.dx ul{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
.empty{color:var(--mute);font-size:14px}
.rx-row{display:grid;gap:8px;grid-template-columns:2fr 1.2fr 1fr .8fr 1.4fr auto;align-items:end;margin-bottom:10px}
@media (max-width:700px){.rx-row{grid-template-columns:1fr 1fr}}
.rx-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--bg)}
.rx-card .hi{font-size:17px;font-weight:700}
.rx-card .en{color:var(--mute);font-size:14px}
.rx-card .tip{margin-top:6px;font-size:14px}
.warnlist{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.warnlist li{font-size:13px;padding:6px 10px;border-radius:10px;background:var(--urgent-bg);color:var(--urgent)}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0}
.note{font-size:12px;color:var(--mute);margin-top:12px}
.err{color:var(--emerg);font-size:14px;margin-top:8px}
@media print{header,.mics,.typed,.tabs,button{display:none!important}.card{box-shadow:none}}
</style>
</head>
<body>
<header>
  <img src="/static/icon.svg" alt="">
  <div><h1>GaonDoc</h1><small>मरीज़ और डॉक्टर के बीच आवाज़ का पुल · Voice health bridge</small></div>
  <div class="sp"></div>
  <button id="end" class="ghost hidden" style="color:#fff;border-color:rgba(255,255,255,.4)">End session</button>
</header>
<main>
  <section id="setup" class="card" style="max-width:560px;margin:0 auto;width:100%">
    <h2>नई जांच शुरू करें · Start a consultation</h2>
    <div class="row">
      <div><label for="pl">मरीज़ की भाषा · Patient language</label><select id="pl"></select></div>
      <div><label for="dl">डॉक्टर की भाषा · Doctor language</label><select id="dl"></select></div>
    </div>
    <label class="consent"><input type="checkbox" id="consent"><span>मरीज़ की सहमति ली गई है कि बातचीत रिकॉर्ड और अनुवादित की जाएगी। · Patient consent has been obtained to record and translate this conversation. Audio is not stored.</span></label>
    <button id="start" disabled style="width:100%">शुरू करें · Start</button>
    <div id="setup-err" class="err"></div>
    <p class="note">यह डॉक्टर का विकल्प नहीं है। सभी सुझाव डॉक्टर की समीक्षा के लिए हैं। · Decision support only. Not a diagnosis.</p>
  </section>

  <div id="app" class="hidden">
    <div id="alert" class="hidden" role="alert" aria-live="assertive"></div>
    <div class="layout" style="margin-top:16px">
      <section class="card">
        <h2>बातचीत · Conversation</h2>
        <div class="mics">
          <button class="mic" id="mic-patient" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>मरीज़ बोले</span><small>Patient</small></button>
          <button class="mic" id="mic-doctor" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>डॉक्टर बोले</span><small>Doctor</small></button>
        </div>
        <form class="typed" id="typed">
          <select id="typed-speaker" aria-label="Speaker"><option value="patient">Patient</option><option value="doctor">Doctor</option></select>
          <input type="text" id="typed-text" placeholder="Type instead of speaking" autocomplete="off">
          <button type="submit">Send</button>
        </form>
        <div id="busy" class="note hidden">Processing…</div>
        <div id="turn-err" class="err"></div>
        <div id="log"></div>
      </section>
      <section class="card">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="case">Case</button>
          <button class="tab" data-tab="rx">Prescription</button>
          <button class="tab" data-tab="summary">Summary</button>
        </div>
        <div id="tab-case"></div>
        <div id="tab-rx" class="hidden"></div>
        <div id="tab-summary" class="hidden"></div>
      </section>
    </div>
  </div>
</main>
<script>
const LANGS = [["hi","हिन्दी · Hindi"],["en","English"],["bn","বাংলা · Bengali"],["ta","தமிழ் · Tamil"],["te","తెలుగు · Telugu"],["mr","मराठी · Marathi"],["gu","ગુજરાતી · Gujarati"],["kn","ಕನ್ನಡ · Kannada"],["ml","മലയാളം · Malayalam"],["pa","ਪੰਜਾਬੀ · Punjabi"],["ur","اردو · Urdu"],["or","ଓଡ଼ିଆ · Odia"]];
const $ = (s) => document.querySelector(s);
const state = { sid: null, rec: null, case: null, rx: [] };

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

async function call(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let detail = "";
    try { detail = (await response.json()).detail; } catch (_) {}
    throw new Error(typeof detail === "string" && detail ? detail : `Request failed (${response.status})`);
  }
  return response.status === 204 ? null : response.json();
}

function play(audio) {
  if (!audio) return;
  new Audio(`data:${audio.mime};base64,${audio.base64}`).play().catch(() => {});
}

function fillSelect(el, value) {
  for (const [code, name] of LANGS) el.append(h("option", { value: code, selected: code === value }, name));
}
fillSelect($("#pl"), "hi");
fillSelect($("#dl"), "en");
$("#consent").addEventListener("change", (e) => ($("#start").disabled = !e.target.checked));

$("#start").addEventListener("click", async () => {
  $("#setup-err").textContent = "";
  try {
    const session = await call("/api/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ patient_language: $("#pl").value, doctor_language: $("#dl").value, consent: true }),
    });
    state.sid = session.id;
    $("#setup").classList.add("hidden");
    $("#app").classList.remove("hidden");
    $("#end").classList.remove("hidden");
    renderCase(null, [], []);
    renderRx();
    renderSummaryTab(null);
  } catch (e) {
    $("#setup-err").textContent = e.message;
  }
});

$("#end").addEventListener("click", async () => {
  if (state.sid) await call(`/api/sessions/${state.sid}`, { method: "DELETE" }).catch(() => {});
  location.reload();
});

document.querySelectorAll(".tab").forEach((tab) =>
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
    for (const name of ["case", "rx", "summary"]) $(`#tab-${name}`).classList.toggle("hidden", name !== tab.dataset.tab);
  })
);

function setBusy(on) {
  $("#busy").classList.toggle("hidden", !on);
}

async function sendTurn(speaker, { audio, text }) {
  $("#turn-err").textContent = "";
  setBusy(true);
  try {
    const form = new FormData();
    form.append("speaker", speaker);
    form.append("speak", "false");
    if (audio) form.append("audio", audio, audio.type.includes("mp4") ? "audio.m4a" : "audio.webm");
    else form.append("text", text);
    const result = await call(`/api/sessions/${state.sid}/turn`, { method: "POST", body: form });
    renderTurn(result);
    if (result.speaker === "patient") {
      renderCase(result.extraction, result.red_flags, result.possible_conditions);
      if (result.alert) showAlert(result.alert);
    }
    play(result.audio);
  } catch (e) {
    $("#turn-err").textContent = e.message;
  } finally {
    setBusy(false);
  }
}

function showAlert(alert) {
  const box = $("#alert");
  box.replaceChildren(h("strong", {}, "⚠ आपातकाल · Emergency"), h("p", {}, alert.text));
  box.classList.remove("hidden");
  play(alert.audio);
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderTurn(r) {
  const label = r.speaker === "patient" ? "मरीज़ · Patient" : "डॉक्टर · Doctor";
  const node = h(
    "div",
    { class: `msg ${r.speaker}` },
    h("div", { class: "who" }, label, r.needs_repeat ? h("span", { class: "badge warn" }, "Low confidence · repeat") : null),
    h("div", {}, r.transcript),
    r.translation && r.translation !== r.transcript ? h("div", { class: "tr" }, r.translation) : null,
    r.translation_warning ? h("div", { class: "meta" }, r.translation_warning) : null,
    r.clinical_summary ? h("div", { class: "meta" }, r.clinical_summary) : null,
    r.audio ? h("button", { class: "ghost", type: "button", style: "margin-top:8px;padding:6px 12px", onclick: () => play(r.audio) }, "▶ Play") : null
  );
  $("#log").prepend(node);
}

async function toggleRecord(speaker, button) {
  if (state.rec) {
    state.rec.recorder.stop();
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (_) {
    $("#turn-err").textContent = "Microphone permission is needed.";
    return;
  }
  const recorder = new MediaRecorder(stream);
  const chunks = [];
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    button.classList.remove("on");
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    state.rec = null;
    if (blob.size) await sendTurn(speaker, { audio: blob });
  };
  state.rec = { recorder };
  button.classList.add("on");
  recorder.start();
}
$("#mic-patient").addEventListener("click", (e) => toggleRecord("patient", e.currentTarget));
$("#mic-doctor").addEventListener("click", (e) => toggleRecord("doctor", e.currentTarget));

$("#typed").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("#typed-text").value.trim();
  if (!text) return;
  $("#typed-text").value = "";
  await sendTurn($("#typed-speaker").value, { text });
});

function renderCase(view, flags, conditions) {
  const root = $("#tab-case");
  if (!view) {
    root.replaceChildren(h("p", { class: "empty" }, "मरीज़ के बोलते ही लक्षण यहां दिखेंगे। · Symptoms appear here as the patient speaks."));
    return;
  }
  const kids = [];
  if (flags.length) {
    kids.push(h("h3", {}, "Alerts"));
    for (const f of flags) kids.push(h("div", { class: `flag ${f.level}` }, h("b", {}, f.level), f.message_en));
  }
  kids.push(h("h3", {}, "Presenting"));
  kids.push(
    view.symptoms.length
      ? h("div", { class: "chips" }, view.symptoms.map((s) => h("span", { class: "chip" }, s.label + (s.duration_text ? ` · ${s.duration_text}` : ""))))
      : h("p", { class: "empty" }, "None captured yet.")
  );
  if (view.denied.length) {
    kids.push(h("h3", {}, "Denies"));
    kids.push(h("div", { class: "chips" }, view.denied.map((d) => h("span", { class: "chip no" }, d.label))));
  }
  const facts = [];
  if (view.age !== null) facts.push(`Age ${view.age}`);
  if (view.pregnant) facts.push("Pregnant");
  if (view.history.length) facts.push(...view.history.map((x) => x.label));
  if (view.allergies.length) facts.push(...view.allergies.map((a) => `Allergy: ${a}`));
  if (facts.length) {
    kids.push(h("h3", {}, "Background"));
    kids.push(h("div", { class: "chips" }, facts.map((f) => h("span", { class: "chip" }, f))));
  }
  if (view.medications.length) {
    kids.push(h("h3", {}, "Medicines mentioned"));
    kids.push(h("div", { class: "chips" }, view.medications.map((m) => h("span", { class: "chip" }, m.ambiguous ? `${m.spoken} → confirm: ${m.candidates.join(" / ")}` : `${m.spoken} → ${m.generic}`))));
  }
  kids.push(h("h3", {}, "Possible conditions · decision support"));
  if (conditions.length) {
    for (const c of conditions) {
      kids.push(
        h(
          "div",
          { class: "dx" },
          h("b", {}, c.name),
          h("div", { class: "bar" }, h("i", { style: `width:${Math.round(c.score * 100)}%` })),
          h("div", { class: "note", style: "margin:0" }, "Based on: " + c.supporting.join(", ")),
          h("ul", {}, c.suggested_checks.map((x) => h("li", {}, x)))
        )
      );
    }
  } else {
    kids.push(h("p", { class: "empty" }, "Not enough information yet."));
  }
  kids.push(h("p", { class: "note" }, "Decision support only. Not a diagnosis. A qualified clinician must review."));
  root.replaceChildren(...kids.flat());
}

function renderRx() {
  const root = $("#tab-rx");
  if (!state.rx.length) state.rx.push({ drug: "", dose: "1 tablet", pattern: "1-0-1", days: 5, timing: "after_food" });
  const rows = state.rx.map((item, i) =>
    h(
      "div",
      { class: "rx-row" },
      h("div", {}, h("label", {}, "Medicine"), h("input", { type: "text", value: item.drug, oninput: (e) => (item.drug = e.target.value) })),
      h("div", {}, h("label", {}, "Dose"), h("input", { type: "text", value: item.dose, oninput: (e) => (item.dose = e.target.value) })),
      h("div", {}, h("label", {}, "Pattern"), h("input", { type: "text", value: item.pattern, placeholder: "1-0-1", oninput: (e) => (item.pattern = e.target.value) })),
      h("div", {}, h("label", {}, "Days"), h("input", { type: "number", min: 1, value: item.days, oninput: (e) => (item.days = e.target.value) })),
      h(
        "div",
        {},
        h("label", {}, "Timing"),
        h("select", { onchange: (e) => (item.timing = e.target.value) }, [["", "—"], ["after_food", "After food"], ["before_food", "Before food"], ["with_food", "With food"], ["empty_stomach", "Empty stomach"]].map(([v, t]) => h("option", { value: v, selected: v === (item.timing || "") }, t)))
      ),
      h("button", { class: "ghost", type: "button", onclick: () => { state.rx.splice(i, 1); renderRx(); } }, "✕")
    )
  );
  const confirmBox = h("input", { type: "checkbox", id: "confirmed" });
  const out = h("div", { id: "rx-out" });
  root.replaceChildren(
    ...rows,
    h("div", { style: "display:flex;gap:8px;margin:8px 0" }, h("button", { class: "ghost", type: "button", onclick: () => { state.rx.push({ drug: "", dose: "1 tablet", pattern: "1-0-1", days: 5, timing: "after_food" }); renderRx(); } }, "+ Add medicine")),
    h("label", { class: "consent", style: "margin:8px 0" }, confirmBox, h("span", {}, "I am the prescriber and confirm these medicines. · मैं डॉक्टर हूं और इन दवाइयों की पुष्टि करता/करती हूं।")),
    h("button", { type: "button", style: "width:100%", onclick: () => submitRx(confirmBox.checked, out) }, "Generate patient guidance"),
    out
  );
}

async function submitRx(confirmed, out) {
  out.replaceChildren(h("p", { class: "note" }, "Processing…"));
  const items = state.rx
    .filter((i) => i.drug.trim().length >= 2)
    .map((i) => ({ drug: i.drug.trim(), dose: i.dose || "", pattern: i.pattern || null, days: i.days ? Number(i.days) : null, timing: i.timing || null }));
  try {
    const g = await call(`/api/sessions/${state.sid}/prescription`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prescriber_confirmed: confirmed, items }) });
    const kids = [];
    if (g.warnings.length) kids.push(h("h3", {}, "Prescriber warnings"), h("ul", { class: "warnlist" }, g.warnings.map((w) => h("li", {}, w.text_en))));
    kids.push(h("h3", {}, "Patient guidance"));
    for (const item of g.items) {
      kids.push(h("div", { class: "rx-card" }, h("div", { class: "hi" }, item.text_hi), h("div", { class: "en" }, item.text_en), item.use_en ? h("div", { class: "tip" }, `${item.use_hi} · ${item.use_en}`) : null, item.tip_hi ? h("div", { class: "tip" }, item.tip_hi) : null));
    }
    if (g.reminders.length) kids.push(h("h3", {}, "Reminders"), h("div", { class: "chips" }, g.reminders.map((r) => h("span", { class: "chip" }, `${r.time} · ${r.drug}`))));
    kids.push(h("div", { style: "margin-top:12px" }, g.spoken.audio ? h("button", { type: "button", onclick: () => play(g.spoken.audio) }, "▶ Play spoken instructions") : h("p", { class: "note" }, "Audio unavailable.")));
    out.replaceChildren(...kids);
    if (g.spoken.audio) play(g.spoken.audio);
  } catch (e) {
    out.replaceChildren(h("p", { class: "err" }, e.message));
  }
}

function renderSummaryTab(data) {
  const root = $("#tab-summary");
  const button = h("button", { type: "button", style: "width:100%", onclick: loadSummary }, "Generate visit summary");
  if (!data) {
    root.replaceChildren(button);
    return;
  }
  root.replaceChildren(
    button,
    h("h3", {}, "Doctor summary"),
    h("pre", {}, data.doctor_summary),
    h("h3", {}, "मरीज़ के लिए सार"),
    h("pre", {}, data.patient_summary.hi),
    h("h3", {}, "Patient summary"),
    h("pre", {}, data.patient_summary.en),
    h("div", { style: "display:flex;gap:8px;margin-top:12px" }, h("button", { class: "ghost", type: "button", onclick: () => window.print() }, "Print"))
  );
}

async function loadSummary() {
  try {
    renderSummaryTab(await call(`/api/sessions/${state.sid}/summary`));
  } catch (e) {
    $("#tab-summary").append(h("p", { class: "err" }, e.message));
  }
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
